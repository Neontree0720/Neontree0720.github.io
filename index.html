<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>네온트리의 사이트</title>
    
</head>
<body>
    <style>
        .header {
  /* 핵심 속성 */
  position: sticky;
  top: 0;           /* 어디에 붙을지 결정 (상단 0 지점) */
  
  /* 스타일 (예시) */
  width: 100%;
  height: 80px;
  background-color: #000000;
  z-index: 1000;    /* 다른 요소보다 위에 보이도록 설정 */
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  border-bottom: 4px solid #333333;
}
    .header1
    {
        color:aqua;
        font-weight:bold;
        font-size: 50px;
        display: flex;                          
  justify-content: space-between;         
  align-items: center;                    
  
  width: 100%;                            
  padding: 0 16px;                        
  box-sizing: border-box;
    }
    body
    {
        background-color:black;
        font-family:"Noto Sans KR";
    }
    .header1 img
    {
        width:50px;
    }
    .hidden {
  display: none;
}
#menu.list{
    position: absolute;
    top: 50px;         /* 헤더 높이에 맞춰 조절 (이미지 바로 아래) */
    right: 0;
}
.github{
    color: white;
}
a {
    color: inherit;
}
.titleneontree{
    
    text-align: center;
    background: linear-gradient(to right, #ffffff 0%, #42f6ff 100%);
  
  
    -webkit-background-clip: text;
  
  
    -webkit-text-fill-color: transparent;
    font-size: 60px;
    font-weight: bold;
    background-clip: text;
    
}
    div{
        color: white;
    }
    
    .sticky-side {
  position: fixed;   /* 화면에 고정 */
    right: 0;          /* 오른쪽 끝에 딱 붙임 */
    top: 0;            /* 맨 위부터 시작 */
    width: 200px;      /* 두께 100px */
    height: 100vh;     /* 화면 높이(v-height) 100% 꽉 채우기 */
    
    background: linear-gradient(to bottom, #1c1c1c, #1c1c1c); /* 은은한 그라데이션 */
    border-left: 1px solid #1a1a1a; /* 왼쪽 경계선 */
    z-index: 9999;     /* 다른 내용보다 무조건 위에 보이게 */
}
    .calcul{
        display: flex;
  justify-content: center; /* 가로 중앙 정렬 */
  align-items: center;
  
}
.calculbutton{
    background-color: #40749d;
  color: #ffffff;
  font-size: 40px;
  font-weight: bold;
  border-radius: 20px;
  width: 400px;
  height: 80px;
  outline: 0px;
}
   

    </style>
    <header class="header">
        <div class="header1">
            <span class="headertitle">
            네온트리의 사이트
            </span>
            <div id="menu">
                
            <img src="/menu.png">
            
            </div>
            
        </div>
        
        
        
    </header>

        <br>등의 웹사이트 개발 코딩을 배우기 시작했습니다.

    </div>

        <button class="calculbutton">계산기로 이동</button>
    </a>
    </div>
    </div>
